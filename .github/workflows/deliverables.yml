name: Migration checkpoint (validation pending)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record tracking-only checkpoint
        shell: pwsh
        run: |
          if (-not (Test-Path MIGRATION-STATUS.md)) { throw 'Migration status is missing.' }
          git log -1 --format='%H %s'
          Write-Host 'Tracking only. Migration implementation, tests and production parity remain pending.'
