<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img"><title>SCR09 Protected owner approval</title><desc>FR-ARC-04 / canonical Ask approval; controls, state variants and actions</desc><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1280" height="840" rx="10" fill="#f2f6fa" stroke="#cfdae5"/><text x="28" y="35" font-size="25" font-weight="700" fill="#20354a">SCR09 — Protected owner approval</text><text x="28" y="61" font-size="14" font-weight="400" fill="#20354a">Vector screen definition · reference units = dp · illustrative state, not a running app</text><rect x="24" y="82" width="165" height="720" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="44" y="119" font-size="19" font-weight="700" fill="#20354a">Android MCP</text><g data-control-id="SCR09.C03" aria-label="Navigation locked during approval"><rect x="34" y="139" width="145" height="48" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="44" y="169" font-size="14" font-weight="400" fill="#20354a">Dashboard</text><rect x="34" y="195" width="145" height="48" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="44" y="225" font-size="14" font-weight="400" fill="#20354a">Clients</text><rect x="34" y="251" width="145" height="48" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="44" y="281" font-size="14" font-weight="400" fill="#20354a">Catalog</text><rect x="34" y="307" width="145" height="48" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="44" y="337" font-size="14" font-weight="400" fill="#20354a">Groups</text><rect x="34" y="363" width="145" height="48" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="44" y="393" font-size="14" font-weight="400" fill="#20354a">Callbacks</text><rect x="34" y="419" width="145" height="48" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="44" y="449" font-size="14" font-weight="400" fill="#20354a">Call logs</text><rect x="34" y="475" width="145" height="48" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="44" y="505" font-size="14" font-weight="400" fill="#20354a">ARC control</text><rect x="34" y="531" width="145" height="48" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="44" y="561" font-size="14" font-weight="400" fill="#20354a">Settings</text></g><rect x="202" y="82" width="732" height="720" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="222" y="124" font-size="23" font-weight="700" fill="#20354a">Protected owner approval</text><text x="222" y="154" font-size="14" font-weight="400" fill="#20354a">Exact local owner decision</text><rect x="218" y="187" width="700" height="44" rx="10" fill="#edf6ef" stroke="#cfdae5"/><text x="232" y="215" font-size="13" font-weight="600" fill="#20354a">Service state / selected client/session scope · owner commands stay separate</text><rect x="218" y="246" width="700" height="88" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="232" y="268" font-size="13" font-weight="600" fill="#20354a">Requested operation</text><text x="232" y="293" font-size="17" font-weight="600" fill="#20354a">Exact client / binding / target</text><text x="232" y="315" font-size="12" font-weight="400" fill="#20354a">Single-use command nonce; changes invalidate approval</text><rect x="218" y="348" width="700" height="88" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="232" y="370" font-size="13" font-weight="600" fill="#20354a">Pinned plan</text><text x="232" y="395" font-size="17" font-weight="600" fill="#20354a">Contract hash / revision / expiry</text><text x="232" y="417" font-size="12" font-weight="400" fill="#20354a">No UI or JSON assertion can create owner authority</text><rect x="218" y="450" width="700" height="88" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="232" y="472" font-size="13" font-weight="600" fill="#20354a">Input boundary</text><text x="232" y="497" font-size="17" font-weight="600" fill="#20354a">Bridge-owned remote input paused</text><text x="232" y="519" font-size="12" font-weight="400" fill="#20354a">Secure owned windows; foreign ADB is not quiesced by us</text><rect x="218" y="552" width="700" height="88" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="232" y="574" font-size="13" font-weight="600" fill="#20354a">Authentication</text><text x="232" y="599" font-size="17" font-weight="600" fill="#20354a">Fresh local owner authentication</text><text x="232" y="621" font-size="12" font-weight="400" fill="#20354a">Dismissal/expiry denies; navigation stays locked</text><g data-control-id="SCR09.C01"><rect x="222" y="674" width="322" height="48" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="235" y="705" font-size="14" font-weight="600" fill="#ffffff">Authenticate and approve</text></g><g data-control-id="SCR09.C02"><rect x="560" y="674" width="322" height="48" rx="10" fill="#eef4f8" stroke="#cfdae5"/><text x="573" y="705" font-size="14" font-weight="600" fill="#20354a">Deny / dismiss</text></g><text x="222" y="757" font-size="12" font-weight="400" fill="#20354a">C01 primary · C02 cancel/secondary · C03 navigation (locked on SCR09)</text><rect x="950" y="82" width="306" height="720" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="970" y="117" font-size="20" font-weight="700" fill="#20354a">Controls / states</text><text x="970" y="149" font-size="13" font-weight="400" fill="#20354a">SCR09.C01 / C02 / C03</text><text x="970" y="181" font-size="13" font-weight="400" fill="#20354a">FR-ARC-04 / canonical Ask approval</text><g data-state-id="SCR09.S1"><rect x="968" y="245" width="270" height="100" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="981" y="270" font-size="13" font-weight="700" fill="#20354a">SCR09.S1</text><text x="981" y="294" font-size="12" font-weight="400" fill="#20354a">Expired: no execution</text></g><g data-state-id="SCR09.S2"><rect x="968" y="355" width="270" height="100" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="981" y="380" font-size="13" font-weight="700" fill="#20354a">SCR09.S2</text><text x="981" y="404" font-size="12" font-weight="400" fill="#20354a">Plan changed: request new review</text></g><g data-state-id="SCR09.S3"><rect x="968" y="465" width="270" height="100" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="981" y="490" font-size="13" font-weight="700" fill="#20354a">SCR09.S3</text><text x="981" y="514" font-size="12" font-weight="400" fill="#20354a">Bridge remote input denied;</text><text x="981" y="532" font-size="12" font-weight="400" fill="#20354a">uncertain isolation blocks</text><text x="981" y="550" font-size="12" font-weight="400" fill="#20354a">approval</text></g><text x="970" y="706" font-size="12" font-weight="400" fill="#20354a">S0: depicted example; 48dp targets</text><text x="970" y="739" font-size="12" font-weight="600" fill="#20354a">No direct SQL or self-approval</text><text x="970" y="767" font-size="12" font-weight="400" fill="#20354a">Narrow layout: same IDs, single pane</text><g data-status-id="SCR09.STATUS"><rect x="1060" y="18" width="180" height="42" rx="8" fill="#e4f2e8"/><text x="1072" y="44" font-size="12" fill="#153d25">MCP Running · snapshot r8</text></g></g></svg>