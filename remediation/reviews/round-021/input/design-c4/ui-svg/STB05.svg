<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img"><title>STB05 Override catalog metadata and export logs</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1680" height="900" rx="10" fill="#f2f6fa" stroke="#cfdae5"/><text x="28" y="42" font-size="25" font-weight="700" fill="#20354a">STB05 — Override catalog metadata and export logs</text><text x="28" y="74" font-size="16" font-weight="400" fill="#20354a">Ordered screen panels · actual controls/states · success, error and cancel branches</text><rect x="28" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="43" y="143" font-size="16" font-weight="700" fill="#20354a">1. Owner · SCR03.S0</text><text x="43" y="173" font-size="15" font-weight="400" fill="#20354a">Full binding catalog</text><rect x="43" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="55" y="251" font-size="12" font-weight="600" fill="#20354a">SCR03 / Full binding catalog</text><text x="55" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="55" y="300" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="55" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="67" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR03.C02 — Draft local override</text><text x="43" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="43" y="473" font-size="14" font-weight="400" fill="#20354a">Immutable source evidence stays</text><text x="43" y="493" font-size="14" font-weight="400" fill="#20354a">unchanged</text><text x="43" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="43" y="582" font-size="13" font-weight="400" fill="#20354a">Schema/identity failure: show reason</text><path d="M 422 342 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="442" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="457" y="143" font-size="16" font-weight="700" fill="#20354a">2. Owner · SCR09.S0</text><text x="457" y="173" font-size="15" font-weight="400" fill="#20354a">Protected owner approval</text><rect x="457" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="469" y="251" font-size="12" font-weight="600" fill="#20354a">SCR09 / Protected owner approval</text><text x="469" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="469" y="300" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="469" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="481" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR09.C01 — Approve pinned override</text><text x="457" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="457" y="473" font-size="14" font-weight="400" fill="#20354a">CAS commits local overlay and history</text><text x="457" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="457" y="582" font-size="13" font-weight="400" fill="#20354a">Stale base/revision: conflict, reload</text><path d="M 836 342 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="856" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="871" y="143" font-size="16" font-weight="700" fill="#20354a">3. Owner · SCR06.S0</text><text x="871" y="173" font-size="15" font-weight="400" fill="#20354a">Call logs</text><rect x="871" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="883" y="251" font-size="12" font-weight="600" fill="#20354a">SCR06 / Call logs</text><text x="883" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="883" y="300" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="883" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="895" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR06.C02 — Preview selected export</text><text x="895" y="365" font-size="12" font-weight="400" fill="#ffffff">scope</text><text x="871" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="871" y="473" font-size="14" font-weight="400" fill="#20354a">Fresh protected review before export</text><text x="871" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="871" y="582" font-size="13" font-weight="400" fill="#20354a">Denied auth: no export data</text><path d="M 1250 342 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="1270" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="1285" y="143" font-size="16" font-weight="700" fill="#20354a">4. Owner · SCR06.S0</text><text x="1285" y="173" font-size="15" font-weight="400" fill="#20354a">Call logs</text><rect x="1285" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="1297" y="251" font-size="12" font-weight="600" fill="#20354a">SCR06 / Call logs</text><text x="1297" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="1297" y="300" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="1297" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="1309" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR06.C01 — Inspect export audit</text><text x="1309" y="365" font-size="12" font-weight="400" fill="#ffffff">record</text><text x="1285" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="1285" y="473" font-size="14" font-weight="400" fill="#20354a">Redacted selected scope or explicit</text><text x="1285" y="493" font-size="14" font-weight="400" fill="#20354a">error</text><text x="1285" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="1285" y="582" font-size="13" font-weight="400" fill="#20354a">Cancel/disk failure: no false success</text><rect x="28" y="752" width="1620" height="119" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="45" y="783" font-size="16" font-weight="700" fill="#20354a">Authority / branch boundary</text><text x="45" y="813" font-size="14" font-weight="400" fill="#20354a">Local overrides cannot manufacture imported availability or grants. Export is owner-scoped, redacted and separate from mandatory audit retention.</text></g></svg>