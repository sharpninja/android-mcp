<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img"><title>STB02 ARC connect, inspect, control and disconnect</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1680" height="900" rx="10" fill="#f2f6fa" stroke="#cfdae5"/><text x="28" y="42" font-size="25" font-weight="700" fill="#20354a">STB02 — ARC connect, inspect, control and disconnect</text><text x="28" y="74" font-size="16" font-weight="400" fill="#20354a">Ordered screen panels · actual controls/states · success, error and cancel branches</text><rect x="28" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="43" y="143" font-size="16" font-weight="700" fill="#20354a">1. Owner · SCR07.S0</text><text x="43" y="173" font-size="15" font-weight="400" fill="#20354a">ARC session and control</text><rect x="43" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="55" y="251" font-size="12" font-weight="600" fill="#20354a">SCR07 / ARC session and control</text><text x="55" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="55" y="300" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="55" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="67" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR07.C01 — Connect selected target</text><text x="43" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="43" y="473" font-size="14" font-weight="400" fill="#20354a">First envelope checked; no handshake</text><text x="43" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="43" y="582" font-size="13" font-weight="400" fill="#20354a">Wrong token/profile: no target data</text><path d="M 422 342 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="442" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="457" y="143" font-size="16" font-weight="700" fill="#20354a">2. Owner · SCR07.S4</text><text x="457" y="173" font-size="15" font-weight="400" fill="#20354a">ARC session and control</text><rect x="457" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="469" y="251" font-size="12" font-weight="600" fill="#20354a">SCR07 / ARC session and control</text><text x="469" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="469" y="300" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="469" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="481" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR07.C01 — Observe capabilities/frame</text><text x="457" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="457" y="473" font-size="14" font-weight="400" fill="#20354a">Verified target generation and DIP scale</text><text x="457" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="457" y="582" font-size="13" font-weight="400" fill="#20354a">Protected/unknown root: no action</text><path d="M 836 342 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="856" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="871" y="143" font-size="16" font-weight="700" fill="#20354a">3. Owner · SCR07.S4</text><text x="871" y="173" font-size="15" font-weight="400" fill="#20354a">ARC session and control</text><rect x="871" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="883" y="251" font-size="12" font-weight="600" fill="#20354a">SCR07 / ARC session and control</text><text x="883" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="883" y="300" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="883" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="895" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR07.C04 — Request admitted control</text><text x="871" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="871" y="473" font-size="14" font-weight="400" fill="#20354a">Exact target policy checked before</text><text x="871" y="493" font-size="14" font-weight="400" fill="#20354a">dispatch</text><text x="871" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="871" y="582" font-size="13" font-weight="400" fill="#20354a">OK envelope plus failed CommandResult is</text><text x="871" y="601" font-size="13" font-weight="400" fill="#20354a">still denied</text><path d="M 1250 342 h17 l-6 -6 m6 6 l-6 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="1270" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="1285" y="143" font-size="16" font-weight="700" fill="#20354a">4. Owner · SCR07.S4</text><text x="1285" y="173" font-size="15" font-weight="400" fill="#20354a">ARC session and control</text><rect x="1285" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="1297" y="251" font-size="12" font-weight="600" fill="#20354a">SCR07 / ARC session and control</text><text x="1297" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="1297" y="300" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="1297" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="1309" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR07.C02 — Disconnect/cancel</text><text x="1285" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="1285" y="473" font-size="14" font-weight="400" fill="#20354a">Watch socket closes; pressed state</text><text x="1285" y="493" font-size="14" font-weight="400" fill="#20354a">released</text><text x="1285" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="1285" y="582" font-size="13" font-weight="400" fill="#20354a">Uncertain click is not blindly replayed</text><rect x="28" y="752" width="1620" height="119" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="45" y="783" font-size="16" font-weight="700" fill="#20354a">Authority / branch boundary</text><text x="45" y="813" font-size="14" font-weight="400" fill="#20354a">Existing ARC v1 bytes remain unchanged. Target operation controls are capability/policy gated; protected local owner surfaces are never an ARC root.</text></g></svg>