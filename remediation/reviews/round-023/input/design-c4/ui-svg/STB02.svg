<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2405" viewBox="0 0 1680 2405" role="img"><title>STB02 ARC select, inspect viewport, control and disconnect</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1680" height="2405" rx="10" fill="#f2f6fa" stroke="#b8c9d8"/><text x="28" y="42" font-size="26" font-weight="700" fill="#20354a">STB02 — ARC select, inspect viewport, control and disconnect</text><text x="28" y="82" font-size="19" font-weight="400" fill="#20354a">Panels show explicit state, actor, control/observation, action, success, error and cancel.</text><rect x="28" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="145" font-size="18" font-weight="700" fill="#20354a">1. Owner · SCR07.S0</text><text x="44" y="176" font-size="18" font-weight="400" fill="#20354a">Choose exact outbound compatible target</text><text x="44" y="200" font-size="18" font-weight="400" fill="#20354a">profile</text><rect x="44" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="279" font-size="18" font-weight="700" fill="#20354a">SCR07 · ARC session and control</text><text x="56" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR07.C05 Select target profile</text><text x="44" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="493" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="44" y="515" font-size="15" font-weight="400" fill="#20354a">change</text><text x="44" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="145" font-size="18" font-weight="700" fill="#20354a">2. Owner · SCR07.S0</text><text x="594" y="176" font-size="18" font-weight="400" fill="#20354a">Connect and request capabilities</text><rect x="594" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="279" font-size="18" font-weight="700" fill="#20354a">SCR07 · ARC session and control</text><text x="606" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR07.C01 Connect selected target</text><text x="594" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="493" font-size="15" font-weight="400" fill="#20354a">First response ID/version/status checked; no</text><text x="594" y="515" font-size="15" font-weight="400" fill="#20354a">handshake</text><text x="594" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="145" font-size="18" font-weight="700" fill="#20354a">3. Owner · SCR07.S4</text><text x="1144" y="176" font-size="18" font-weight="400" fill="#20354a">Inspect frame viewport and selected tree node</text><rect x="1144" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="279" font-size="18" font-weight="700" fill="#20354a">SCR07 · ARC session and control</text><text x="1156" y="309" font-size="15" font-weight="400" fill="#20354a">Connected: C06 refreshes frame/tree; C04/C07</text><text x="1156" y="331" font-size="15" font-weight="400" fill="#20354a">require current target capability and policy</text><text x="1156" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR07.C06 Inspect tree or refresh frame</text><text x="1144" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="493" font-size="15" font-weight="400" fill="#20354a">Current-root dimensions/density visible; stale node</text><text x="1144" y="515" font-size="15" font-weight="400" fill="#20354a">rejected</text><text x="1144" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="860" font-size="18" font-weight="700" fill="#20354a">4. Owner · SCR07.S4</text><text x="44" y="891" font-size="18" font-weight="400" fill="#20354a">Press, move and release across unary requests</text><rect x="44" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="994" font-size="18" font-weight="700" fill="#20354a">SCR07 · ARC session and control</text><text x="56" y="1024" font-size="15" font-weight="400" fill="#20354a">Connected: C06 refreshes frame/tree; C04/C07</text><text x="56" y="1046" font-size="15" font-weight="400" fill="#20354a">require current target capability and policy</text><text x="56" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR07.C07 Pointer or wheel input</text><text x="44" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="1208" font-size="15" font-weight="400" fill="#20354a">Principal/root lease serializes current-coordinate</text><text x="44" y="1230" font-size="15" font-weight="400" fill="#20354a">input; no wire generation invented</text><text x="44" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="860" font-size="18" font-weight="700" fill="#20354a">5. Owner · SCR07.S4</text><text x="594" y="891" font-size="18" font-weight="400" fill="#20354a">Send key/text using approved named mapping</text><rect x="594" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="994" font-size="18" font-weight="700" fill="#20354a">SCR07 · ARC session and control</text><text x="606" y="1024" font-size="15" font-weight="400" fill="#20354a">Connected: C06 refreshes frame/tree; C04/C07</text><text x="606" y="1046" font-size="15" font-weight="400" fill="#20354a">require current target capability and policy</text><text x="606" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR07.C04 Send typed input; disabled</text><text x="606" y="1120" font-size="14" font-weight="400" fill="#20354a">unless connected capability/policy permits</text><text x="594" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="1208" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="594" y="1230" font-size="15" font-weight="400" fill="#20354a">change</text><text x="594" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="1334" font-size="14" font-weight="400" fill="#20354a">Unknown key or failed CommandResult is displayed</text><text x="594" y="1354" font-size="14" font-weight="400" fill="#20354a">even with OK envelope</text><text x="594" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="860" font-size="18" font-weight="700" fill="#20354a">6. Owner · SCR07.S4</text><text x="1144" y="891" font-size="18" font-weight="400" fill="#20354a">Disconnect controller</text><rect x="1144" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="994" font-size="18" font-weight="700" fill="#20354a">SCR07 · ARC session and control</text><text x="1156" y="1024" font-size="15" font-weight="400" fill="#20354a">Connected: C06 refreshes frame/tree; C04/C07</text><text x="1156" y="1046" font-size="15" font-weight="400" fill="#20354a">require current target capability and policy</text><text x="1156" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR07.C02 Disconnect / cancel</text><text x="1144" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="1208" font-size="15" font-weight="400" fill="#20354a">Best-effort releases then watch socket close; idle</text><text x="1144" y="1230" font-size="15" font-weight="400" fill="#20354a">lease bound covers network failure</text><text x="1144" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="1575" font-size="18" font-weight="700" fill="#20354a">7. Owner · SCR07.S2</text><text x="44" y="1606" font-size="18" font-weight="400" fill="#20354a">Inspect wrong-token failure</text><rect x="44" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR07 · ARC session and control</text><text x="56" y="1739" font-size="15" font-weight="400" fill="#20354a">Unknown protocol: reject before send</text><text x="56" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR07.C01 Connect selected target</text><text x="44" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="1923" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="44" y="1945" font-size="15" font-weight="400" fill="#20354a">change</text><text x="44" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="2049" font-size="14" font-weight="400" fill="#20354a">No tree/frame data or enabled input controls</text><text x="44" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="1575" font-size="18" font-weight="700" fill="#20354a">8. Owner · SCR08.S6</text><text x="594" y="1606" font-size="18" font-weight="400" fill="#20354a">Inspect inbound listener separately from</text><text x="594" y="1630" font-size="18" font-weight="400" fill="#20354a">outbound controller</text><rect x="594" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="606" y="1739" font-size="15" font-weight="400" fill="#20354a">Inbound ARC ready: bound127.0.0.1:port, approved</text><text x="606" y="1761" font-size="15" font-weight="400" fill="#20354a">ordinary root and controller list</text><text x="606" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR08.C09 Inspect inbound controllers</text><text x="594" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="1923" font-size="15" font-weight="400" fill="#20354a">Bound loopback endpoint, exposed ordinary root and</text><text x="594" y="1945" font-size="15" font-weight="400" fill="#20354a">incoming principals shown</text><text x="594" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="2049" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="2069" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><text x="28" y="2320" font-size="16" font-weight="400" fill="#20354a">External events are observed on the anchored UI control, not a remote press on that control. Protected mutations require exact local owner authentication;</text><text x="28" y="2344" font-size="16" font-weight="400" fill="#20354a">discovery/activation/pairing does not grant device authority. Self-ADB does not grant any MCP client capability.</text></g></svg>