<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="3120" viewBox="0 0 1680 3120" role="img"><title>STB03 Protected configuration, start and truthful failure</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1680" height="3120" rx="10" fill="#f2f6fa" stroke="#b8c9d8"/><text x="28" y="42" font-size="26" font-weight="700" fill="#20354a">STB03 — Protected configuration, start and truthful failure</text><text x="28" y="82" font-size="19" font-weight="400" fill="#20354a">Panels show explicit state, actor, control/observation, action, success, error and cancel.</text><rect x="28" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="145" font-size="18" font-weight="700" fill="#20354a">1. Owner · SCR08.S0</text><text x="44" y="176" font-size="18" font-weight="400" fill="#20354a">Edit exact boot/listener draft</text><rect x="44" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="279" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="56" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR08.C05 Edit startup and MCP listener</text><text x="44" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="493" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="44" y="515" font-size="15" font-weight="400" fill="#20354a">change</text><text x="44" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="145" font-size="18" font-weight="700" fill="#20354a">2. Owner · SCR08.S0</text><text x="594" y="176" font-size="18" font-weight="400" fill="#20354a">Discard alternative</text><rect x="594" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="279" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="606" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR08.C04 Discard settings draft</text><text x="594" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="493" font-size="15" font-weight="400" fill="#20354a">No committed setting changes</text><text x="594" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="145" font-size="18" font-weight="700" fill="#20354a">3. Owner · SCR08.S0</text><text x="1144" y="176" font-size="18" font-weight="400" fill="#20354a">Save reviewed exact draft</text><rect x="1144" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="279" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="1156" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="1156" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR08.C01 Save with revision</text><text x="1144" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="493" font-size="15" font-weight="400" fill="#20354a">SCR09 shows exact values/revisions</text><text x="1144" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="860" font-size="18" font-weight="700" fill="#20354a">4. Owner · SCR09.S0</text><text x="44" y="891" font-size="18" font-weight="400" fill="#20354a">Fresh protected proof and CAS</text><rect x="44" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="994" font-size="18" font-weight="700" fill="#20354a">SCR09 · Protected owner approval</text><text x="56" y="1024" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR09.C01 Authenticate and approve</text><text x="44" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="1208" font-size="15" font-weight="400" fill="#20354a">Return SCR08 committed revision; queue next pending</text><text x="44" y="1230" font-size="15" font-weight="400" fill="#20354a">challenge</text><text x="44" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="860" font-size="18" font-weight="700" fill="#20354a">5. Owner · SCR08.S0</text><text x="594" y="891" font-size="18" font-weight="400" fill="#20354a">Navigate to dashboard</text><rect x="594" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="994" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="606" y="1024" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR08.C03 Open navigation</text><text x="594" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="1208" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="594" y="1230" font-size="15" font-weight="400" fill="#20354a">change</text><text x="594" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="860" font-size="18" font-weight="700" fill="#20354a">6. Owner · SCR01.S3</text><text x="1144" y="891" font-size="18" font-weight="400" fill="#20354a">Request foreground start</text><rect x="1144" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="994" font-size="18" font-weight="700" fill="#20354a">SCR01 · Dashboard</text><text x="1156" y="1024" font-size="15" font-weight="400" fill="#20354a">Stopped: no listener, no Running badge</text><text x="1156" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR01.C01 Start / Stop service</text><text x="1144" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="1208" font-size="15" font-weight="400" fill="#20354a">Starting, admission closed, then actual ready</text><text x="1144" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="1575" font-size="18" font-weight="700" fill="#20354a">7. Owner · SCR01.S0</text><text x="44" y="1606" font-size="18" font-weight="400" fill="#20354a">Inspect healthy tuple</text><rect x="44" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR01 · Dashboard</text><text x="56" y="1739" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR01.C04 Open health details</text><text x="44" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="1923" font-size="15" font-weight="400" fill="#20354a">MCP ready is separate from ADB paired-offline</text><text x="44" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="2049" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="2069" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="1575" font-size="18" font-weight="700" fill="#20354a">8. Owner · SCR10.S0</text><text x="594" y="1606" font-size="18" font-weight="400" fill="#20354a">Failure branch after denied/failed start</text><rect x="594" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR10 · Action required</text><text x="606" y="1739" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR10.C05 Inspect failure reason</text><text x="594" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="1923" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="594" y="1945" font-size="15" font-weight="400" fill="#20354a">change</text><text x="594" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="2049" font-size="14" font-weight="400" fill="#20354a">Error badge, no Running; exact recovery reason</text><text x="594" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="1575" font-size="18" font-weight="700" fill="#20354a">9. Owner · SCR10.S0</text><text x="1144" y="1606" font-size="18" font-weight="400" fill="#20354a">Explicit retry after prerequisite fixed</text><rect x="1144" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR10 · Action required</text><text x="1156" y="1739" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="1156" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR10.C01 Review prerequisites</text><text x="1144" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="1923" font-size="15" font-weight="400" fill="#20354a">No permission or settings bypass; Starting</text><text x="1144" y="1945" font-size="15" font-weight="400" fill="#20354a">reevaluated</text><text x="1144" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="2049" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="2069" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28" y="2260" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="2290" font-size="18" font-weight="700" fill="#20354a">10. Owner · SCR09.S0</text><text x="44" y="2321" font-size="18" font-weight="400" fill="#20354a">Deny/cancel configuration review alternative</text><rect x="44" y="2397" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="2424" font-size="18" font-weight="700" fill="#20354a">SCR09 · Protected owner approval</text><text x="56" y="2454" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="2530" font-size="14" font-weight="400" fill="#20354a">Control: SCR09.C02 Deny / dismiss</text><text x="44" y="2612" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="2638" font-size="15" font-weight="400" fill="#20354a">Return SCR08 previous committed revision</text><text x="44" y="2738" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="2764" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="2784" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="2841" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="2867" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><text x="28" y="3035" font-size="16" font-weight="400" fill="#20354a">External events are observed on the anchored UI control, not a remote press on that control. Protected mutations require exact local owner authentication;</text><text x="28" y="3059" font-size="16" font-weight="400" fill="#20354a">discovery/activation/pairing does not grant device authority. Self-ADB does not grant any MCP client capability.</text></g></svg>