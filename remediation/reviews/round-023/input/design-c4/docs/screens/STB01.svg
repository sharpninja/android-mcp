<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2405" viewBox="0 0 1680 2405" role="img"><title>STB01 Agent discovers groups, subscribes and owner cancels</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1680" height="2405" rx="10" fill="#f2f6fa" stroke="#b8c9d8"/><text x="28" y="42" font-size="26" font-weight="700" fill="#20354a">STB01 — Agent discovers groups, subscribes and owner cancels</text><text x="28" y="82" font-size="19" font-weight="400" fill="#20354a">Panels show explicit state, actor, control/observation, action, success, error and cancel.</text><rect x="28" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="145" font-size="18" font-weight="700" fill="#20354a">1. External MCP client · SCR04.S0</text><text x="44" y="176" font-size="18" font-weight="400" fill="#20354a">External android.groups.discover; owner</text><text x="44" y="200" font-size="18" font-weight="400" fill="#20354a">preview updates only</text><rect x="44" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="279" font-size="18" font-weight="700" fill="#20354a">SCR04 · Groups for a job</text><text x="56" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="385" font-size="14" font-weight="400" fill="#20354a">Observation anchor: SCR04.C06 Search group</text><text x="56" y="405" font-size="14" font-weight="400" fill="#20354a">summaries</text><text x="44" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="493" font-size="15" font-weight="400" fill="#20354a">Ranked summaries bounded by max_bytes; no authority</text><text x="44" y="515" font-size="15" font-weight="400" fill="#20354a">granted</text><text x="44" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="145" font-size="18" font-weight="700" fill="#20354a">2. External MCP client · SCR04.S0</text><text x="594" y="176" font-size="18" font-weight="400" fill="#20354a">External describe then set_active CAS</text><rect x="594" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="279" font-size="18" font-weight="700" fill="#20354a">SCR04 · Groups for a job</text><text x="606" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="385" font-size="14" font-weight="400" fill="#20354a">Observation anchor: SCR04.C07 Describe selected</text><text x="606" y="405" font-size="14" font-weight="400" fill="#20354a">group</text><text x="594" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="493" font-size="15" font-weight="400" fill="#20354a">Atomic client group view; portable binding.invoke</text><text x="594" y="515" font-size="15" font-weight="400" fill="#20354a">remains</text><text x="594" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="145" font-size="18" font-weight="700" fill="#20354a">3. External MCP client · SCR05.S0</text><text x="1144" y="176" font-size="18" font-weight="400" fill="#20354a">External binding.invoke with callback,</text><text x="1144" y="200" font-size="18" font-weight="400" fill="#20354a">resources/subscribe, bounded read</text><rect x="1144" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="279" font-size="18" font-weight="700" fill="#20354a">SCR05 · Callback subscriptions</text><text x="1156" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="1156" y="385" font-size="14" font-weight="400" fill="#20354a">Observation anchor: SCR05.C06 Refresh status</text><text x="1144" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="493" font-size="15" font-weight="400" fill="#20354a">Finite handle then URI-only hint and journal read;</text><text x="1144" y="515" font-size="15" font-weight="400" fill="#20354a">callback list updates</text><text x="1144" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="860" font-size="18" font-weight="700" fill="#20354a">4. Owner · SCR05.S0</text><text x="44" y="891" font-size="18" font-weight="400" fill="#20354a">Owner inspects exact subscription and cleanup</text><text x="44" y="915" font-size="18" font-weight="400" fill="#20354a">phase</text><rect x="44" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="994" font-size="18" font-weight="700" fill="#20354a">SCR05 · Callback subscriptions</text><text x="56" y="1024" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR05.C01 Inspect bounded status</text><text x="44" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="1208" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="44" y="1230" font-size="15" font-weight="400" fill="#20354a">change</text><text x="44" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="860" font-size="18" font-weight="700" fill="#20354a">5. Owner · SCR05.S0</text><text x="594" y="891" font-size="18" font-weight="400" fill="#20354a">Open exact administrative cancellation review</text><rect x="594" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="994" font-size="18" font-weight="700" fill="#20354a">SCR05 · Callback subscriptions</text><text x="606" y="1024" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR05.C02 Cancel via owner review</text><text x="594" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="1208" font-size="15" font-weight="400" fill="#20354a">SCR09 challenge binds selected subscription/revision</text><text x="594" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="860" font-size="18" font-weight="700" fill="#20354a">6. Owner · SCR09.S0</text><text x="1144" y="891" font-size="18" font-weight="400" fill="#20354a">Confirm this administrative cancellation</text><rect x="1144" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="994" font-size="18" font-weight="700" fill="#20354a">SCR09 · Protected owner approval</text><text x="1156" y="1024" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="1156" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR09.C01 Authenticate and approve</text><text x="1144" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="1208" font-size="15" font-weight="400" fill="#20354a">Delivery closed and recorded cleanup issued once</text><text x="1144" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="1575" font-size="18" font-weight="700" fill="#20354a">7. Owner · SCR05.S4</text><text x="44" y="1606" font-size="18" font-weight="400" fill="#20354a">Read terminal event/status</text><rect x="44" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR05 · Callback subscriptions</text><text x="56" y="1739" font-size="15" font-weight="400" fill="#20354a">Closed delivery: show confirmed or unknown</text><text x="56" y="1761" font-size="15" font-weight="400" fill="#20354a">cleanup</text><text x="56" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR05.C06 Refresh status</text><text x="44" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="1923" font-size="15" font-weight="400" fill="#20354a">Client learns cancellation through callback.status</text><text x="44" y="1945" font-size="15" font-weight="400" fill="#20354a">or retained terminal journal; cleanup confirmed or</text><text x="44" y="1967" font-size="15" font-weight="400" fill="#20354a">unknown</text><text x="44" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="2049" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="2069" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="1575" font-size="18" font-weight="700" fill="#20354a">8. Owner · SCR05.S3</text><text x="594" y="1606" font-size="18" font-weight="400" fill="#20354a">Inspect cleanup uncertainty without replay</text><rect x="594" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR05 · Callback subscriptions</text><text x="606" y="1739" font-size="15" font-weight="400" fill="#20354a">Backend death/orphan/revoke: payload hidden;</text><text x="606" y="1761" font-size="15" font-weight="400" fill="#20354a">cleanup may be unknown</text><text x="606" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR05.C06 Refresh status</text><text x="594" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="1923" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="594" y="1945" font-size="15" font-weight="400" fill="#20354a">change</text><text x="594" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="2049" font-size="14" font-weight="400" fill="#20354a">Uncertain cleanup keeps phase=cleanup and delivery</text><text x="594" y="2069" font-size="14" font-weight="400" fill="#20354a">closed</text><text x="594" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="1575" font-size="18" font-weight="700" fill="#20354a">9. Owner · SCR09.S0</text><text x="1144" y="1606" font-size="18" font-weight="400" fill="#20354a">Cancellation alternative before commit</text><rect x="1144" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR09 · Protected owner approval</text><text x="1156" y="1739" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="1156" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR09.C02 Deny / dismiss</text><text x="1144" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="1923" font-size="15" font-weight="400" fill="#20354a">Return SCR05; registration unchanged</text><text x="1144" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="2049" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="2069" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><text x="28" y="2320" font-size="16" font-weight="400" fill="#20354a">External events are observed on the anchored UI control, not a remote press on that control. Protected mutations require exact local owner authentication;</text><text x="28" y="2344" font-size="16" font-weight="400" fill="#20354a">discovery/activation/pairing does not grant device authority. Self-ADB does not grant any MCP client capability.</text></g></svg>