<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2405" viewBox="0 0 1680 2405" role="img"><title>STB06 Pair self-ADB and inspect independent backend health</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1680" height="2405" rx="10" fill="#f2f6fa" stroke="#b8c9d8"/><text x="28" y="42" font-size="26" font-weight="700" fill="#20354a">STB06 — Pair self-ADB and inspect independent backend health</text><text x="28" y="82" font-size="19" font-weight="400" fill="#20354a">Panels show explicit state, actor, control/observation, action, success, error and cancel.</text><rect x="28" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="145" font-size="18" font-weight="700" fill="#20354a">1. Owner · SCR08.S0</text><text x="44" y="176" font-size="18" font-weight="400" fill="#20354a">Enter device/user and Android-provided pairing</text><text x="44" y="200" font-size="18" font-weight="400" fill="#20354a">host/port/code</text><rect x="44" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="279" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="56" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR08.C06 Edit same-device ADB profile</text><text x="44" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="493" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="44" y="515" font-size="15" font-weight="400" fill="#20354a">change</text><text x="44" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="145" font-size="18" font-weight="700" fill="#20354a">2. Owner · SCR08.S0</text><text x="594" y="176" font-size="18" font-weight="400" fill="#20354a">Request exact pair/connect command</text><rect x="594" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="279" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="606" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR08.C02 Review pairing</text><text x="594" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="493" font-size="15" font-weight="400" fill="#20354a">SCR09 review; no Android debugging toggle</text><text x="594" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="145" font-size="18" font-weight="700" fill="#20354a">3. Owner · SCR09.S0</text><text x="1144" y="176" font-size="18" font-weight="400" fill="#20354a">Authenticate exact profile and peer request</text><rect x="1144" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="279" font-size="18" font-weight="700" fill="#20354a">SCR09 · Protected owner approval</text><text x="1156" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="1156" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR09.C01 Authenticate and approve</text><text x="1144" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="493" font-size="15" font-weight="400" fill="#20354a">Bounded native pairing/connect starts</text><text x="1144" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="860" font-size="18" font-weight="700" fill="#20354a">4. Android backend · SCR08.S0</text><text x="44" y="891" font-size="18" font-weight="400" fill="#20354a">Observe paired peer/backend status</text><rect x="44" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="994" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="56" y="1024" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="1100" font-size="14" font-weight="400" fill="#20354a">Observation anchor: SCR08.C09 Inspect inbound</text><text x="56" y="1120" font-size="14" font-weight="400" fill="#20354a">controllers</text><text x="44" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="1208" font-size="15" font-weight="400" fill="#20354a">Status change is evidence, never an MCP grant</text><text x="44" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="860" font-size="18" font-weight="700" fill="#20354a">5. Owner · SCR08.S0</text><text x="594" y="891" font-size="18" font-weight="400" fill="#20354a">Navigate dashboard</text><rect x="594" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="994" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="606" y="1024" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR08.C03 Open navigation</text><text x="594" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="1208" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="594" y="1230" font-size="15" font-weight="400" fill="#20354a">change</text><text x="594" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="860" font-size="18" font-weight="700" fill="#20354a">6. Owner · SCR01.S0</text><text x="1144" y="891" font-size="18" font-weight="400" fill="#20354a">Inspect MCP ready versus ADB Paired</text><text x="1144" y="915" font-size="18" font-weight="400" fill="#20354a">offline/Connected</text><rect x="1144" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="994" font-size="18" font-weight="700" fill="#20354a">SCR01 · Dashboard</text><text x="1156" y="1024" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="1156" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR01.C04 Open health details</text><text x="1144" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="1208" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="1144" y="1230" font-size="15" font-weight="400" fill="#20354a">change</text><text x="1144" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="1575" font-size="18" font-weight="700" fill="#20354a">7. Owner · SCR08.S4</text><text x="44" y="1606" font-size="18" font-weight="400" fill="#20354a">Wrong peer/code branch</text><rect x="44" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR08 · Settings and backends</text><text x="56" y="1739" font-size="15" font-weight="400" fill="#20354a">Pairing failed/peer unverified: no Connected</text><text x="56" y="1761" font-size="15" font-weight="400" fill="#20354a">state and no new MCP grant</text><text x="56" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR08.C02 Review pairing</text><text x="44" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="1923" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="44" y="1945" font-size="15" font-weight="400" fill="#20354a">change</text><text x="44" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="2049" font-size="14" font-weight="400" fill="#20354a">Unverified peer never becomes Connected</text><text x="44" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="1545" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="1575" font-size="18" font-weight="700" fill="#20354a">8. Owner · SCR09.S0</text><text x="594" y="1606" font-size="18" font-weight="400" fill="#20354a">Cancel pairing alternative</text><rect x="594" y="1682" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="1709" font-size="18" font-weight="700" fill="#20354a">SCR09 · Protected owner approval</text><text x="606" y="1739" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="1815" font-size="14" font-weight="400" fill="#20354a">Control: SCR09.C02 Deny / dismiss</text><text x="594" y="1897" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="1923" font-size="15" font-weight="400" fill="#20354a">No profile/key change</text><text x="594" y="2023" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="2049" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="2069" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="2126" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="2152" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><text x="28" y="2320" font-size="16" font-weight="400" fill="#20354a">External events are observed on the anchored UI control, not a remote press on that control. Protected mutations require exact local owner authentication;</text><text x="28" y="2344" font-size="16" font-weight="400" fill="#20354a">discovery/activation/pairing does not grant device authority. Self-ADB does not grant any MCP client capability.</text></g></svg>