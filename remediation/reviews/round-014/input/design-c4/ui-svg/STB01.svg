<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img"><title>Discover, activate and consume a callback</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1600" height="780" rx="0" fill="#f2f6fa" stroke="#cfdae5"/><text x="30" y="45" font-size="28" font-weight="700" fill="#20354a">STB01 - Discover, activate and consume a callback</text><text x="30" y="77" font-size="17" font-weight="400" fill="#20354a">Screen storyboard: ordered user actions, transitions and error/cancel branches</text><rect x="30" y="115" width="365" height="485" rx="12" fill="#ffffff" stroke="#cfdae5"/><text x="48" y="151" font-size="18" font-weight="700" fill="#20354a">1. Describe the job</text><text x="48" y="181" font-size="15" font-weight="600" fill="#20354a">SCR04</text><rect x="48" y="206" width="329" height="170" rx="12" fill="#e8f0f7" stroke="#cfdae5"/><rect x="60" y="220" width="305" height="24" rx="12" fill="#ffffff" stroke="#cfdae5"/><text x="71" y="237" font-size="12" font-weight="400" fill="#20354a">SCR04 / selected screen state</text><rect x="60" y="260" width="305" height="46" rx="12" fill="#ffffff" stroke="#cfdae5"/><rect x="60" y="318" width="180" height="35" rx="12" fill="#234b70" stroke="#cfdae5"/><text x="72" y="341" font-size="13" font-weight="600" fill="#ffffff">User action</text><text x="48" y="411" font-size="16" font-weight="400" fill="#20354a">Read bounded group summaries</text><text x="48" y="476" font-size="14" font-weight="700" fill="#8b5c14">Alternate path</text><text x="48" y="504" font-size="15" font-weight="400" fill="#20354a">Denied permission stays visible</text><path d="M 398 335 h 22 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="427" y="115" width="365" height="485" rx="12" fill="#ffffff" stroke="#cfdae5"/><text x="445" y="151" font-size="18" font-weight="700" fill="#20354a">2. Select coherent group</text><text x="445" y="181" font-size="15" font-weight="600" fill="#20354a">SCR04</text><rect x="445" y="206" width="329" height="170" rx="12" fill="#e8f0f7" stroke="#cfdae5"/><rect x="457" y="220" width="305" height="24" rx="12" fill="#ffffff" stroke="#cfdae5"/><text x="468" y="237" font-size="12" font-weight="400" fill="#20354a">SCR04 / selected screen state</text><rect x="457" y="260" width="305" height="46" rx="12" fill="#ffffff" stroke="#cfdae5"/><rect x="457" y="318" width="180" height="35" rx="12" fill="#234b70" stroke="#cfdae5"/><text x="469" y="341" font-size="13" font-weight="600" fill="#ffffff">User action</text><text x="445" y="411" font-size="16" font-weight="400" fill="#20354a">CAS activate within byte budget</text><text x="445" y="476" font-size="14" font-weight="700" fill="#8b5c14">Alternate path</text><text x="445" y="504" font-size="15" font-weight="400" fill="#20354a">Conflict/budget error: nothing</text><text x="445" y="525" font-size="15" font-weight="400" fill="#20354a">partial</text><path d="M 795 335 h 22 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="824" y="115" width="365" height="485" rx="12" fill="#ffffff" stroke="#cfdae5"/><text x="842" y="151" font-size="18" font-weight="700" fill="#20354a">3. Register and consume</text><text x="842" y="181" font-size="15" font-weight="600" fill="#20354a">SCR05</text><rect x="842" y="206" width="329" height="170" rx="12" fill="#e8f0f7" stroke="#cfdae5"/><rect x="854" y="220" width="305" height="24" rx="12" fill="#ffffff" stroke="#cfdae5"/><text x="865" y="237" font-size="12" font-weight="400" fill="#20354a">SCR05 / selected screen state</text><rect x="854" y="260" width="305" height="46" rx="12" fill="#ffffff" stroke="#cfdae5"/><rect x="854" y="318" width="180" height="35" rx="12" fill="#234b70" stroke="#cfdae5"/><text x="866" y="341" font-size="13" font-weight="600" fill="#ffffff">User action</text><text x="842" y="411" font-size="16" font-weight="400" fill="#20354a">One final response, then journal</text><text x="842" y="432" font-size="16" font-weight="400" fill="#20354a">pages</text><text x="842" y="476" font-size="14" font-weight="700" fill="#8b5c14">Alternate path</text><text x="842" y="504" font-size="15" font-weight="400" fill="#20354a">Expired cursor: show retention</text><text x="842" y="525" font-size="15" font-weight="400" fill="#20354a">boundary</text><path d="M 1192 335 h 22 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="1221" y="115" width="365" height="485" rx="12" fill="#ffffff" stroke="#cfdae5"/><text x="1239" y="151" font-size="18" font-weight="700" fill="#20354a">4. Cancel explicitly</text><text x="1239" y="181" font-size="15" font-weight="600" fill="#20354a">SCR05</text><rect x="1239" y="206" width="329" height="170" rx="12" fill="#e8f0f7" stroke="#cfdae5"/><rect x="1251" y="220" width="305" height="24" rx="12" fill="#ffffff" stroke="#cfdae5"/><text x="1262" y="237" font-size="12" font-weight="400" fill="#20354a">SCR05 / selected screen state</text><rect x="1251" y="260" width="305" height="46" rx="12" fill="#ffffff" stroke="#cfdae5"/><rect x="1251" y="318" width="180" height="35" rx="12" fill="#234b70" stroke="#cfdae5"/><text x="1263" y="341" font-size="13" font-weight="600" fill="#ffffff">User action</text><text x="1239" y="411" font-size="16" font-weight="400" fill="#20354a">Stop delivery; verify unregister</text><text x="1239" y="476" font-size="14" font-weight="700" fill="#8b5c14">Alternate path</text><text x="1239" y="504" font-size="15" font-weight="400" fill="#20354a">Cleanup unknown remains visible</text><rect x="30" y="633" width="1544" height="105" rx="12" fill="#fff6e8" stroke="#cfdae5"/><text x="48" y="663" font-size="16" font-weight="700" fill="#20354a">Boundary / branch</text><text x="48" y="690" font-size="16" font-weight="400" fill="#20354a">If a grant is missing, stop and open local owner review (SCR09); activation never grants permission.</text></g></svg>