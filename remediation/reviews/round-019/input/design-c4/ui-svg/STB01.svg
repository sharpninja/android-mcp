<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img"><title>STB01 Inspect an agent session and stop a callback</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1680" height="900" rx="10" fill="#f2f6fa" stroke="#cfdae5"/><text x="28" y="42" font-size="25" font-weight="700" fill="#20354a">STB01 — Inspect an agent session and stop a callback</text><text x="28" y="74" font-size="16" font-weight="400" fill="#20354a">Ordered screen panels · actual controls/states · success, error and cancel branches</text><rect x="28" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="43" y="143" font-size="16" font-weight="700" fill="#20354a">1. Owner · SCR04.S0</text><text x="43" y="173" font-size="15" font-weight="400" fill="#20354a">Groups for a job</text><rect x="43" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="55" y="251" font-size="12" font-weight="600" fill="#20354a">SCR04 / Groups for a job</text><text x="55" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="55" y="299" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="55" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="67" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR04.C01 — Inspect group summary</text><text x="43" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="43" y="473" font-size="14" font-weight="400" fill="#20354a">Selected client/session shown</text><text x="43" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="43" y="582" font-size="13" font-weight="400" fill="#20354a">Denied grant remains visible; no UI</text><text x="43" y="601" font-size="13" font-weight="400" fill="#20354a">activation</text><path d="M 422 342 h 17 l -6 -6 m 6 6 l -6 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="442" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="457" y="143" font-size="16" font-weight="700" fill="#20354a">2. Owner · SCR05.S0</text><text x="457" y="173" font-size="15" font-weight="400" fill="#20354a">Callback subscriptions</text><rect x="457" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="469" y="251" font-size="12" font-weight="600" fill="#20354a">SCR05 / Callback subscriptions</text><text x="469" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="469" y="299" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="469" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="481" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR05.C01 — Inspect subscription</text><text x="481" y="365" font-size="12" font-weight="400" fill="#ffffff">status</text><text x="457" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="457" y="473" font-size="14" font-weight="400" fill="#20354a">Agent registered via its own MCP session</text><text x="457" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="457" y="582" font-size="13" font-weight="400" fill="#20354a">No registration: SCR05.S1; never</text><text x="457" y="601" font-size="13" font-weight="400" fill="#20354a">impersonate client</text><path d="M 836 342 h 17 l -6 -6 m 6 6 l -6 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="856" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="871" y="143" font-size="16" font-weight="700" fill="#20354a">3. Owner · SCR09.S0</text><text x="871" y="173" font-size="15" font-weight="400" fill="#20354a">Protected owner approval</text><rect x="871" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="883" y="251" font-size="12" font-weight="600" fill="#20354a">SCR09 / Protected owner approval</text><text x="883" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="883" y="299" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="883" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="895" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR09.C01 — Approve exact admin</text><text x="895" y="365" font-size="12" font-weight="400" fill="#ffffff">cancellation</text><text x="871" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="871" y="473" font-size="14" font-weight="400" fill="#20354a">Nonce/revision-bound cancellation</text><text x="871" y="493" font-size="14" font-weight="400" fill="#20354a">admitted</text><text x="871" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="871" y="582" font-size="13" font-weight="400" fill="#20354a">Dismiss/expiry: no cancellation command</text><path d="M 1250 342 h 17 l -6 -6 m 6 6 l -6 6" fill="none" stroke="#234b70" stroke-width="3"/><rect x="1270" y="110" width="392" height="615" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="1285" y="143" font-size="16" font-weight="700" fill="#20354a">4. Owner · SCR05.S4</text><text x="1285" y="173" font-size="15" font-weight="400" fill="#20354a">Callback subscriptions</text><rect x="1285" y="224" width="362" height="183" rx="10" fill="#e8f0f7" stroke="#cfdae5"/><text x="1297" y="251" font-size="12" font-weight="600" fill="#20354a">SCR05 / Callback subscriptions</text><text x="1297" y="281" font-size="12" font-weight="400" fill="#20354a">Selected client/session or exact target</text><text x="1297" y="299" font-size="12" font-weight="400" fill="#20354a">scope</text><rect x="1297" y="324" width="338" height="60" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="1309" y="347" font-size="12" font-weight="400" fill="#ffffff">SCR05.C01 — Inspect closed delivery</text><text x="1285" y="446" font-size="14" font-weight="700" fill="#20354a">Success / transition</text><text x="1285" y="473" font-size="14" font-weight="400" fill="#20354a">Cleanup confirmed or explicitly unknown</text><text x="1285" y="555" font-size="14" font-weight="700" fill="#20354a">Error / cancel branch</text><text x="1285" y="582" font-size="13" font-weight="400" fill="#20354a">Backend death: payload hidden; retain</text><text x="1285" y="601" font-size="13" font-weight="400" fill="#20354a">cleanup status</text><rect x="28" y="752" width="1620" height="119" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="45" y="783" font-size="16" font-weight="700" fill="#20354a">Authority / branch boundary</text><text x="45" y="813" font-size="14" font-weight="400" fill="#20354a">The agent owns MCP discovery/activation/registration/resource reads. The owner UI observes scoped metadata; administrative cancellation uses protected owner authority, not</text><text x="45" y="834" font-size="14" font-weight="400" fill="#20354a">client impersonation.</text></g></svg>