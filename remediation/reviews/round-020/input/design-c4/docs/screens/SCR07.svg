"88" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="232" y="574" font-size="13" font-weight="600" fill="#20354a">Input / frame</text><text x="232" y="599" font-size="17" font-weight="600" fill="#20354a">Root generation and DIP scale pinned</text><text x="232" y="621" font-size="12" font-weight="400" fill="#20354a">No multitouch claim; protected owner root excluded</text><g data-control-id="SCR07.C01"><rect x="222" y="674" width="322" height="48" rx="10" fill="#234b70" stroke="#cfdae5"/><text x="235" y="705" font-size="14" font-weight="600" fill="#ffffff">Connect selected target</text></g><g data-control-id="SCR07.C02"><rect x="560" y="674" width="322" height="48" rx="10" fill="#eef4f8" stroke="#cfdae5"/><text x="573" y="705" font-size="14" font-weight="600" fill="#20354a">Disconnect / cancel</text></g><g data-control-id="SCR07.C04"><rect x="727" y="574" width="179" height="48" rx="10" fill="#eef4f8" stroke="#cfdae5"/><text x="737" y="603" font-size="12" font-weight="400" fill="#20354a">Send input (disabled)</text></g><text x="222" y="757" font-size="12" font-weight="400" fill="#20354a">C01 primary · C02 cancel/secondary · C03 navigation (locked on SCR09)</text><rect x="950" y="82" width="306" height="720" rx="10" fill="#ffffff" stroke="#cfdae5"/><text x="970" y="117" font-size="20" font-weight="700" fill="#20354a">Controls / states</text><text x="970" y="149" font-size="13" font-weight="400" fill="#20354a">SCR07.C01 / C02 / C03</text><text x="970" y="181" font-size="13" font-weight="400" fill="#20354a">FR-ARC-01 / 02 / 03 / 04</text><g data-state-id="SCR07.S1"><rect x="968" y="245" width="270" height="100" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="981" y="270" font-size="13" font-weight="700" fill="#20354a">SCR07.S1</text><text x="981" y="294" font-size="12" font-weight="400" fill="#20354a">Wrong token: no target content</text></g><g data-state-id="SCR07.S2"><rect x="968" y="355" width="270" height="100" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="981" y="380" font-size="13" font-weight="700" fill="#20354a">SCR07.S2</text><text x="981" y="404" font-size="12" font-weight="400" fill="#20354a">Unknown protocol: reject before</text><text x="981" y="422" font-size="12" font-weight="400" fill="#20354a">send</text></g><g data-state-id="SCR07.S3"><rect x="968" y="465" width="270" height="100" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="981" y="490" font-size="13" font-weight="700" fill="#20354a">SCR07.S3</text><text x="981" y="514" font-size="12" font-weight="400" fill="#20354a">Protected root: capture/input</text><text x="981" y="532" font-size="12" font-weight="400" fill="#20354a">denied</text></g><g data-state-id="SCR07.S4"><rect x="968" y="575" width="270" height="100" rx="10" fill="#fff6e8" stroke="#cfdae5"/><text x="981" y="600" font-size="13" font-weight="700" fill="#20354a">SCR07.S4</text><text x="981" y="624" font-size="12" font-weight="400" fill="#20354a">Connected: C01 refreshes frame;</text><text x="981" y="642" font-size="12" font-weight="400" fill="#20354a">C04 enabled only by current</text><text x="981" y="660" font-size="12" font-weight="400" fill="#20354a">capability/policy</text></g><text x="970" y="706" font-size="12" font-weight="400" fill="#20354a">S0: depicted example; 48dp targets</text><text x="970" y="739" font-size="12" font-weight="600" fill="#20354a">No direct SQL or self-approval</text><text x="970" y="767" font-size="12" font-weight="400" fill="#20354a">Narrow layout: same IDs, single pane</text><g data-status-id="SCR07.STATUS"><rect x="1060" y="18" width="180" height="42" rx="8" fill="#e4f2e8"/><text x="1072" y="44" font-size="12" fill="#153d25">MCP Running · snapshot r8</text></g></g></svg>