e="18" font-weight="700" fill="#20354a">11. Owner · SCR06.S3</text><text x="594" y="2321" font-size="18" font-weight="400" fill="#20354a">Quota/audit failure branch</text><rect x="594" y="2397" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="2424" font-size="18" font-weight="700" fill="#20354a">SCR06 · Call logs</text><text x="606" y="2454" font-size="15" font-weight="400" fill="#20354a">Disk quota: visible retention error</text><text x="606" y="2530" font-size="14" font-weight="400" fill="#20354a">Control: SCR06.C01 Inspect record</text><text x="594" y="2612" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="2638" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="594" y="2660" font-size="15" font-weight="400" fill="#20354a">change</text><text x="594" y="2738" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="2764" font-size="14" font-weight="400" fill="#20354a">Mandatory audit failure closes admission; optional</text><text x="594" y="2784" font-size="14" font-weight="400" fill="#20354a">logs evicted first</text><text x="594" y="2841" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="2867" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="2260" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="2290" font-size="18" font-weight="700" fill="#20354a">12. Owner · SCR03.S0</text><text x="1144" y="2321" font-size="18" font-weight="400" fill="#20354a">Absent-catalog import branch</text><rect x="1144" y="2397" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="2424" font-size="18" font-weight="700" fill="#20354a">SCR03 · Full binding catalog</text><text x="1156" y="2454" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="1156" y="2530" font-size="14" font-weight="400" fill="#20354a">Control: SCR03.C06 Choose import document</text><text x="1144" y="2612" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="2638" font-size="15" font-weight="400" fill="#20354a">SAF copy/validation stage; protected activation</text><text x="1144" y="2660" font-size="15" font-weight="400" fill="#20354a">review required</text><text x="1144" y="2738" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="2764" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="2784" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="2841" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="2867" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><text x="28" y="3035" font-size="16" font-weight="400" fill="#20354a">External events are observed on the anchored UI control, not a remote press on that control. Protected mutations require exact local owner authentication;</text><text x="28" y="3059" font-size="16" font-weight="400" fill="#20354a">discovery/activation/pairing does not grant device authority. Self-ADB does not grant any MCP client capability.</text></g></svg>