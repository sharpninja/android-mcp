<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="3120" viewBox="0 0 1680 3120" role="img"><title>STB05 Catalog preview and scoped log export</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1680" height="3120" rx="10" fill="#f2f6fa" stroke="#b8c9d8"/><text x="28" y="42" font-size="26" font-weight="700" fill="#20354a">STB05 — Catalog preview and scoped log export</text><text x="28" y="82" font-size="19" font-weight="400" fill="#20354a">Panels show explicit state, actor, control/observation, action, success, error and cancel.</text><rect x="28" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="44" y="145" font-size="18" font-weight="700" fill="#20354a">1. Owner · SCR03.S0</text><text x="44" y="176" font-size="18" font-weight="400" fill="#20354a">Search binding/type evidence including unknown</text><rect x="44" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="56" y="279" font-size="18" font-weight="700" fill="#20354a">SCR03 · Full binding catalog</text><text x="56" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="56" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR03.C04 Search inventory</text><text x="44" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="44" y="493" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="44" y="515" font-size="15" font-weight="400" fill="#20354a">change</text><text x="44" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="44" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="44" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="44" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="44" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="578" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="594" y="145" font-size="18" font-weight="700" fill="#20354a">2. Owner · SCR03.S0</text><text x="594" y="176" font-size="18" font-weight="400" fill="#20354a">Inspect selected evidence and runtime-versus-</text><text x="594" y="200" font-size="18" font-weight="400" fill="#20354a">grant distinction</text><rect x="594" y="252" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="606" y="279" font-size="18" font-weight="700" fill="#20354a">SCR03 · Full binding catalog</text><text x="606" y="309" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="606" y="385" font-size="14" font-weight="400" fill="#20354a">Control: SCR03.C01 Inspect evidence</text><text x="594" y="467" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="594" y="493" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="594" y="515" font-size="15" font-weight="400" fill="#20354a">change</text><text x="594" y="593" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="594" y="619" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="639" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="696" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="722" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="115" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="145" font-size="18" font-weight="700" fill="#20354a">3. Owner · SCR03.S0</text><text x="1144" y="176" font-size="18" font-weight="400" fill="#20354a">Edit local override draft</text><rect x="1144" y="252" w