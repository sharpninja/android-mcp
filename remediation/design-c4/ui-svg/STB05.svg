="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="594" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="594" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="594" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="1128" y="830" width="526" height="690" rx="10" fill="#fff" stroke="#b8c9d8"/><text x="1144" y="860" font-size="18" font-weight="700" fill="#20354a">6. Owner · SCR06.S0</text><text x="1144" y="891" font-size="18" font-weight="400" fill="#20354a">Select clients/time/outcome and redacted</text><text x="1144" y="915" font-size="18" font-weight="400" fill="#20354a">snapshot</text><rect x="1144" y="967" width="494" height="180" rx="10" fill="#e2ecf5" stroke="#b8c9d8"/><text x="1156" y="994" font-size="18" font-weight="700" fill="#20354a">SCR06 · Call logs</text><text x="1156" y="1024" font-size="15" font-weight="400" fill="#20354a">Depicted normal/example state</text><text x="1156" y="1100" font-size="14" font-weight="400" fill="#20354a">Control: SCR06.C04 Filter logs</text><text x="1144" y="1182" font-size="17" font-weight="700" fill="#20354a">Success →</text><text x="1144" y="1208" font-size="15" font-weight="400" fill="#20354a">Show exact resulting state; no implicit permission</text><text x="1144" y="1230" font-size="15" font-weight="400" fill="#20354a">change</text><text x="1144" y="1308" font-size="17" font-weight="700" fill="#20354a">Error →</text><text x="1144" y="1334" font-size="14" font-weight="400" fill="#20354a">Show sanitized denial/failure and retain unchanged</text><text x="1144" y="1354" font-size="14" font-weight="400" fill="#20354a">revisions</text><text x="1144" y="1411" font-size="17" font-weight="700" fill="#20354a">Cancel →</text><text x="1144" y="1437" font-size="14" font-weight="400" fill="#20354a">Cancel/back returns without the uncommitted effect</text><rect x="28