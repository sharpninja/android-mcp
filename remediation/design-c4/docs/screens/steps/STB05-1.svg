xt><text x="26" y="401" font-size="14" fill="#203950">Modal drawer below840dp; persistent rail at840dp+. Back returns previous detail, with Discard/Stay for dirty</text><text x="26" y="420" font-size="14" fill="#203950">drafts.</text><text x="26" y="449" font-size="13" fill="#203950">Design only · local control/state contract; no Android implementation or authority granted</text></g></svg>
