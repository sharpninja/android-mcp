et</text><text x="26" y="417" font-size="17" fill="#203950">Effect: Show exact fields/dependencies/ETag, stage hash/size, estimate/deadline and admin window.</text><text x="26" y="447" font-size="17" fill="#203950">Recovery: Discard or request SCR09 approval for this exact command; preview itself never commits.</text><text x="26" y="481" font-size="14" fill="#203950">Modal drawer below840dp; persistent rail at840dp+. Back returns previous detail, with Discard/Stay for dirty</text><text x="26" y="500" font-size="14" fill="#203950">drafts.</text><text x="26" y="529" font-size="13" fill="#203950">Design only · local control/state contract; no Android implementation or authority granted</text></g></svg>
