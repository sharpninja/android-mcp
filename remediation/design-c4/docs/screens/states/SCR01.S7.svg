<svg data-screen-state="SCR01.S7" xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img"><title>SCR01.S7 Waiting for unlock: minimal nonsecret status only</title><rect width="100%" height="100%" fill="#f2f6fb"/><g font-family="DejaVu Sans, sans-serif"><text x="26" y="40" font-size="27" fill="#203950">SCR01 — Dashboard</text><text x="26" y="81" font-size="20" fill="#203950">SCR01.S7 · Waiting for unlock: minimal nonsecret status only</text><g data-status-id="SCR01.STATUS" data-health-snapshot="{&quot;service&quot;:&quot;WaitingForUnlock&quot;,&quot;desired_state&quot;:&quot;running&quot;,&quot;mcp&quot;:&quot;absent&quot;,&quot;adb&quot;:&quot;locked&quot;,&quot;device_view&quot;:&quot;absent&quot;,&quot;catalog&quot;:&quot;absent&quot;,&quot;arc_listener&quot;:&quot;disabled&quot;,&quot;revision&quot;:17,&quot;pause_reason&quot;:null}"><rect x="26" y="109" width="848" height="58" rx="7" fill="#e3f1ec"/><text x="38" y="131" font-size="14" fill="#203950">Service WaitingForUnlock (desired running) · MCP absent · ADB locked · view absent · catalog absent ·</text><text x="38" y="150" font-size="14" fill="#203950">ARC disabled · 17</text></g><text x="26" y="189" font-size="15" fill="#203950">Minimal nonsecret boot status; no client identity or secret shown</text><g data-control-id="SCR01.C01" data-enabled="false"><rect x="26" y="223" width="416" height="67" rx="6" fill="#e1e5e9" stroke="#a9b0b7"/><text x="36" y="246" font-size="17" fill="#65707b">SCR01.C01 · Start / Stop service</text><text x="36" y="282" font-size="12" fill="#586878">Disabled in this state</text></g><g data-control-id="SCR01.C02" data-enabled="false"><rect x="458" y="223" width="416" height="67" rx="6" fill="#e1e5e9" stroke="#a9b0b7"/><text x="468" y="246" font-size="17" fill="#65707b">SCR01.C02 · Open subscriptions</text><text x="468" y="282" font-size="12" fill="#586878">Disabled in this state</text></g><g data-control-id="SCR01.C03" data-enabled="true"><rect x="26" y="299" width="416" height="67" rx="6" fill="#ffffff" stroke="#a2bad1"/><text x="36" y="322" font-size="17" fill="#203950">SCR01.C03 · Open navigation</text><text x="36" y="358" font-size="12" fill="#586878">navigation</text></g><g data-control-id="SCR01.C04" data-enabled="true"><rect x="458" y="299" width="416" height="67" rx="6" fill="#ffffff" stroke="#a2bad1"/><text x="468" y="322" font-size="17" fill="#203950">SCR01.C04 · Open health details</text><text x="468" y="358" font-size="12" fill="#586878">read</text></g><g data-control-id="SCR01.C05" data-enabled="false"><rect x="26" y="375" width="416" height="67" rx="6" fill="#e1e5e9" stroke="#a9b0b7"/><text x="36" y="398" font-size="17" fill="#65707b">SCR01.C05 · Refresh device view</text><text x="36" y="434" font-size="12" fill="#586878">Disabled in this state</text></g><text x="26" y="466" font-size="17" fill="#203950">Effect: Boot preference mirror requested startup, but credential-encrypted catalog/config/keys are</text><text x="26" y="488" font-size="17" fill="#203950">unavailable. No listener/device admission.</text><text x="26" y="518" font-size="17" fill="#203950">Recovery: Unlock normally, reconcile boot preference and request eligible startup; never move</text><text x="26" y="540" font-size="17" fill="#203950">secrets to device-protected storage.</text><text x="26" y="574" font-size="14" fill="#203950">Modal drawer below840dp; persistent rail at840dp+. Back returns previous detail, with Discard/Stay for dirty</text><text x="26" y="593" font-size="14" fill="#203950">drafts.</text><text x="26" y="622" font-size="13" fill="#203950">Design only · local control/state contract; no Android implementation or authority granted</text></g></svg>
