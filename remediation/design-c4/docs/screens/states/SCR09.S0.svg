<svg data-screen-state="SCR09.S0" xmlns="http://www.w3.org/2000/svg" width="900" height="605" viewBox="0 0 900 605" role="img"><title>SCR09.S0 Exact local challenge: quiesced and unexpired</title><rect width="100%" height="100%" fill="#f2f6fb"/><g font-family="DejaVu Sans, sans-serif"><text x="26" y="40" font-size="27" fill="#203950">SCR09 — Protected owner approval</text><text x="26" y="81" font-size="20" fill="#203950">SCR09.S0 · Exact local challenge: quiesced and unexpired</text><g data-status-id="SCR09.STATUS" data-health-snapshot="{&quot;service&quot;:&quot;Paused&quot;,&quot;desired_state&quot;:&quot;running&quot;,&quot;mcp&quot;:&quot;ready&quot;,&quot;adb&quot;:&quot;offline&quot;,&quot;device_view&quot;:&quot;ready&quot;,&quot;catalog&quot;:&quot;ready&quot;,&quot;arc_listener&quot;:&quot;disabled&quot;,&quot;revision&quot;:10,&quot;pause_reason&quot;:&quot;OWNER_CHALLENGE&quot;}"><rect x="26" y="109" width="848" height="58" rx="7" fill="#e3f1ec"/><text x="38" y="131" font-size="14" fill="#203950">Service Paused / OWNER_CHALLENGE (desired running) · MCP ready · ADB offline · view ready · catalog</text><text x="38" y="150" font-size="14" fill="#203950">ready · ARC disabled · 10</text></g><text x="26" y="189" font-size="17" fill="#9a3323">Protected local owner surface · no remote approve/navigation · global dispatch pause only while</text><text x="26" y="211" font-size="17" fill="#9a3323">a challenge remains pending</text><text x="26" y="233" font-size="15" fill="#203950">Exact command hash/scope/revisions,nonce,original deadline and queue position</text><text x="26" y="253" font-size="15" fill="#203950">Current challenge ID; FIFO queue excluding expired entries</text><text x="26" y="273" font-size="15" fill="#203950">Principal/operation/hash/revisions/phase,queued count; secrets redacted</text><g data-control-id="SCR09.C01" data-enabled="true"><rect x="26" y="307" width="416" height="67" rx="6" fill="#ffffff" stroke="#a2bad1"/><text x="36" y="330" font-size="17" fill="#203950">SCR09.C01 · Authenticate and approve</text><text x="36" y="366" font-size="12" fill="#586878">protected-action</text></g><g data-control-id="SCR09.C02" data-enabled="true"><rect x="458" y="307" width="416" height="67" rx="6" fill="#ffffff" stroke="#a2bad1"/><text x="468" y="330" font-size="17" fill="#203950">SCR09.C02 · Deny / dismiss</text><text x="468" y="366" font-size="12" fill="#586878">cancel</text></g><g data-control-id="SCR09.C03" data-enabled="false"><rect x="26" y="383" width="416" height="67" rx="6" fill="#e1e5e9" stroke="#a9b0b7"/><text x="36" y="406" font-size="17" fill="#65707b">SCR09.C03 · Locked navigation</text><text x="36" y="442" font-size="12" fill="#586878">Disabled in this state</text></g><g data-control-id="SCR09.C04" data-enabled="true"><rect x="458" y="383" width="416" height="67" rx="6" fill="#ffffff" stroke="#a2bad1"/><text x="468" y="406" font-size="17" fill="#203950">SCR09.C04 · Inspect exact challenge</text><text x="468" y="442" font-size="12" fill="#586878">read</text></g><text x="26" y="474" font-size="17" fill="#203950">Effect: No remote input/capture; one immutable command waits for platform proof.</text><text x="26" y="504" font-size="17" fill="#203950">Recovery: Authenticate once or Deny/Back; queue is FIFO by issued time excluding expired requests.</text><text x="26" y="538" font-size="14" fill="#203950">No drawer or destination route on protected SCR09; Back denies current challenge.</text><text x="26" y="567" font-size="13" fill="#203950">Design only · local control/state contract; no Android implementation or authority granted</text></g></svg>
