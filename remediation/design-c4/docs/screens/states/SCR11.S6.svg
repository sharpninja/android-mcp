<svg data-screen-state="SCR11.S6" xmlns="http://www.w3.org/2000/svg" width="900" height="726" viewBox="0 0 900 726" role="img"><title>SCR11.S6 Manual bearer sealed: protected one-time reveal</title><rect width="100%" height="100%" fill="#f2f6fb"/><g font-family="DejaVu Sans, sans-serif"><text x="26" y="40" font-size="27" fill="#203950">SCR11 — Client pairing</text><text x="26" y="81" font-size="20" fill="#203950">SCR11.S6 · Manual bearer sealed: protected one-time reveal</text><g data-status-id="SCR11.STATUS" data-health-snapshot="{&quot;service&quot;:&quot;Running&quot;,&quot;desired_state&quot;:&quot;running&quot;,&quot;mcp&quot;:&quot;ready&quot;,&quot;adb&quot;:&quot;offline&quot;,&quot;device_view&quot;:&quot;ready&quot;,&quot;catalog&quot;:&quot;ready&quot;,&quot;arc_listener&quot;:&quot;disabled&quot;,&quot;revision&quot;:16,&quot;pause_reason&quot;:null}"><rect x="26" y="109" width="848" height="58" rx="7" fill="#e3f1ec"/><text x="38" y="131" font-size="14" fill="#203950">Service Running (desired running) · MCP ready · ADB offline · view ready · catalog ready · ARC disabled</text><text x="38" y="150" font-size="14" fill="#203950">· 16</text></g><text x="26" y="189" font-size="15" fill="#203950">Selected client kind; app stores verifier and Keystore-protected secret reference only when required</text><g data-control-id="SCR11.C01" data-enabled="false"><rect x="26" y="223" width="416" height="67" rx="6" fill="#e1e5e9" stroke="#a9b0b7"/><text x="36" y="246" font-size="17" fill="#65707b">SCR11.C01 · Generate pairing challenge</text><text x="36" y="282" font-size="12" fill="#586878">Disabled in this state</text></g><g data-control-id="SCR11.C02" data-enabled="false"><rect x="458" y="223" width="416" height="67" rx="6" fill="#e1e5e9" stroke="#a9b0b7"/><text x="468" y="246" font-size="17" fill="#65707b">SCR11.C02 · Cancel pairing</text><text x="468" y="282" font-size="12" fill="#586878">Disabled in this state</text></g><g data-control-id="SCR11.C03" data-enabled="true"><rect x="26" y="299" width="416" height="67" rx="6" fill="#ffffff" stroke="#a2bad1"/><text x="36" y="322" font-size="17" fill="#203950">SCR11.C03 · Open navigation</text><text x="36" y="358" font-size="12" fill="#586878">navigation</text></g><g data-control-id="SCR11.C04" data-enabled="false"><rect x="458" y="299" width="416" height="67" rx="6" fill="#e1e5e9" stroke="#a9b0b7"/><text x="468" y="322" font-size="17" fill="#65707b">SCR11.C04 · Choose pairing flow</text><text x="468" y="358" font-size="12" fill="#586878">Disabled in this state</text></g><g data-control-id="SCR11.C05" data-enabled="false"><rect x="26" y="375" width="416" height="73" rx="6" fill="#e1e5e9" stroke="#a9b0b7"/><text x="36" y="398" font-size="17" fill="#65707b">SCR11.C05 · Inspect submitted client</text><text x="36" y="419" font-size="17" fill="#65707b">proof</text><text x="36" y="440" font-size="12" fill="#586878">Disabled in this state</text></g><g data-control-id="SCR11.C06" data-enabled="false"><rect x="458" y="375" width="416" height="67" rx="6" fill="#e1e5e9" stroke="#a9b0b7"/><text x="468" y="398" font-size="17" fill="#65707b">SCR11.C06 · Review exact client commit</text><text x="468" y="434" font-size="12" fill="#586878">Disabled in this state</text></g><g data-control-id="SCR11.C07" data-enabled="true"><rect x="26" y="457" width="416" height="73" rx="6" fill="#ffffff" stroke="#a2bad1"/><text x="36" y="480" font-size="17" fill="#203950">SCR11.C07 · Reveal/share manual bearer</text><text x="36" y="501" font-size="17" fill="#203950">once</text><text x="36" y="522" font-size="12" fill="#586878">protected-action</text></g><text x="26" y="554" font-size="17" fill="#203950">Effect: Owner-issued verifier stored; secret view/share excluded from ARC/capture/logs.</text><text x="26" y="584" font-size="17" fill="#203950">Recovery: Reveal/share once to explicit recipient; cancel erases pending reveal, not a committed</text><text x="26" y="606" font-size="17" fill="#203950">principal.</text><text x="26" y="640" font-size="14" fill="#203950">Modal drawer below840dp; persistent rail at840dp+. Back returns previous detail, with Discard/Stay for dirty</text><text x="26" y="659" font-size="14" fill="#203950">drafts.</text><text x="26" y="688" font-size="13" fill="#203950">Design only · local control/state contract; no Android implementation or authority granted</text></g></svg>
